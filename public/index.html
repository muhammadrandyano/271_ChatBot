<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot AI - Vercel Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Topbar mirip Vercel -->
    <div class="vercel-nav">
        <div class="logo">
            <svg width="20" height="20" viewBox="0 0 75 65" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M37.59 0L75.17 65H0L37.59 0Z" fill="black"/>
            </svg>
            <span>Chatbot AI</span>
        </div>
        <div class="nav-links">
            <span class="badge">NVIDIA Nemotron 3 Ultra</span>
        </div>
    </div>

    <!-- Container Utama -->
    <main class="chat-container">
        <div class="chat-window" id="chatWindow">
            <!-- Pesan Awal -->
            <div class="message bot-message">
                <div class="avatar">AI</div>
                <div class="msg-content">Halo! Ada yang bisa saya bantu hari ini?</div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ketik pesan..." autocomplete="off">
            <button id="sendBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
